<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trip Genie</title>
<!-- ===== PWA：加到主畫面像獨立 App ===== -->
<meta name="theme-color" content="#2C6E49" id="metaTheme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip Genie">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<style>
/* ============ 主題色系 ============ */
/* 森林：加重綠＋焦糖棕，輔色葉綠/莓紅 */
:root{
  --bg:#F1EDE1; --surface:#ffffff; --primary:#2C6E49; --primary-soft:#D3E7DA;
  --accent:#B5651D; --accent-soft:#F0E1CE; --accent2:#7A9A4E; --accent3:#B24C57;
  --meal-bg:#FAEFDD; --text:#26261D; --muted:#807A67; --line:#E1DCCB;
  --shadow:0 6px 20px rgba(60,55,40,.12); --shadow-sm:0 2px 8px rgba(60,55,40,.10);
  --radius:16px;
}
/* 海洋：加灰調的深→淺海水藍＋琥珀橙，輔色灰青綠/珊瑚 */
[data-theme="ocean"]{
  --bg:#E7EDF1; --surface:#ffffff; --primary:#2A6E96; --primary-soft:#C6D8E2;
  --accent:#EE9040; --accent-soft:#F7E4D2; --accent2:#3596A0; --accent3:#E07A72;
  --meal-bg:#DDE9EA; --text:#182A34; --muted:#607985; --line:#CBD9E1;
  --shadow:0 6px 20px rgba(30,60,90,.14); --shadow-sm:0 2px 8px rgba(30,60,90,.11);
}
/* 城市：提亮藍＋番茄紅，加芥黃對比 */
[data-theme="city"]{
  --bg:#F5F3EF; --surface:#ffffff; --primary:#2F5D8A; --primary-soft:#D6E3F1;
  --accent:#E4491F; --accent-soft:#FBDDD2; --accent2:#F4B740; --accent3:#3AA0A6;
  --meal-bg:#FBE9E1; --text:#1E212A; --muted:#787A83; --line:#E1DED7;
  --shadow:0 6px 20px rgba(35,38,43,.14); --shadow-sm:0 2px 8px rgba(35,38,43,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--text); transition:background .3s;
  -webkit-font-smoothing:antialiased;
  height:100vh; height:100dvh; overflow:hidden; display:flex; flex-direction:column;
}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

/* ============ 頂欄 ============ */
.topbar{
  position:relative;z-index:50;flex:none;background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px 22px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm);
}
.brand{font-family:"Dela Gothic One",Georgia,serif;font-weight:400;font-size:30px;line-height:1;color:var(--primary);letter-spacing:1px;display:flex;align-items:center;white-space:nowrap;padding:2px 0}
.spacer{flex:1}
.theme-switch{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;border:1px solid var(--line)}
.theme-btn{border:none;background:transparent;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px;transition:.2s}
.theme-btn .dot{width:12px;height:12px;border-radius:50%}
.theme-btn[data-t="forest"] .dot{background:#2F6B4F}
.theme-btn[data-t="ocean"] .dot{background:#3A86C8}
.theme-btn[data-t="city"] .dot{background:#2E4A66}
.theme-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

/* ============ 通用按鈕 ============ */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 15px;border-radius:11px;font-size:14px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--bg);color:var(--text)}
.btn.danger{color:#c0392b;border-color:#f0c8c2}
.btn.danger:hover{background:#fbeae7;border-color:#c0392b}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}

/* ============ 首頁卡片牆 ============ */
.wrap{max-width:1180px;margin:0 auto;padding:30px 24px 60px}
#homeView{flex:1;overflow-y:auto;min-height:0;width:100%}
#tripView{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.page-title{font-size:26px;font-weight:800;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:26px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.trip-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow-sm);transition:.2s;cursor:pointer;position:relative;
  display:flex;flex-direction:column;min-height:158px;
}
.trip-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--primary)}
.trip-card .cover{height:74px;background:linear-gradient(135deg,var(--primary),var(--accent2));position:relative}
.trip-card .cover .emoji{position:absolute;right:14px;bottom:8px;font-size:34px;opacity:.9}
.trip-card .body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
.trip-card .tname{font-size:17px;font-weight:800;line-height:1.3}
.trip-card .tdate{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.trip-card .tmeta{margin-top:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;padding-top:8px}
.trip-card .acts{position:absolute;top:8px;right:8px;display:flex;gap:5px;opacity:0;transition:.2s}
.trip-card:hover .acts{opacity:1}
.mini-btn{width:28px;height:28px;border-radius:8px;border:none;background:rgba(255,255,255,.9);color:#333;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.mini-btn:hover{background:#fff}
.mini-btn.del:hover{background:#fbeae7;color:#c0392b}
.add-card{
  border:2px dashed var(--line);border-radius:var(--radius);background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--muted);font-weight:700;font-size:15px;min-height:158px;transition:.2s;cursor:pointer;
}
.add-card:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.add-card .plus{font-size:34px;line-height:1;font-weight:300}
.empty-hint{color:var(--muted);font-size:14px;padding:40px 0;text-align:center}

/* ============ 行程內頁 ============ */
.trip-head{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex:none;position:relative;z-index:40;box-shadow:var(--shadow-sm);flex-wrap:wrap}
.trip-head .tt{font-size:18px;font-weight:800}
.trip-head .td{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:11px;border:1px solid var(--line)}
.tab{border:none;background:transparent;padding:7px 16px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted)}
.tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
.mode-switch{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:11px;border:1px solid var(--line)}
.mode-btn{border:none;background:transparent;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.mode-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.dropdown{position:relative}
.dropdown .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:190px;display:none;z-index:60}
.dropdown.open .menu{display:block}
.menu-item{padding:9px 12px;border-radius:8px;font-size:13.5px;display:flex;align-items:center;gap:9px;color:var(--text)}
.menu-item:hover{background:var(--bg)}
.menu-item .tag{margin-left:auto;font-size:10px;color:var(--muted);background:var(--bg);padding:2px 6px;border-radius:6px}

/* ============ 時間軸 grid ============ */
.sched-scroll{overflow:auto;flex:1;min-height:0;padding:0 0 48px 0}
.sched{display:grid;min-width:max-content;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.seg-label,.day-head,.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.corner{background:var(--primary-soft);border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;left:0;top:0;z-index:4}
.day-head{background:var(--primary-soft);padding:10px 12px;text-align:center;position:sticky;top:0;z-index:2}
.day-head .dh-date{font-size:14px;font-weight:800;color:var(--primary)}
.day-head .dh-loc{font-size:11px;color:var(--muted);margin-top:2px;min-height:13px}
.seg-label{background:var(--bg);padding:12px 10px;font-size:13px;font-weight:800;color:var(--text);position:sticky;left:0;z-index:2;display:flex;align-items:center;justify-content:center;text-align:center;min-width:76px}
.cell{padding:7px;background:var(--surface);min-height:64px;display:flex;flex-direction:column;gap:6px;transition:background .15s}
.cell.dragover{background:var(--primary-soft)}
.seg-label.meal{background:var(--meal-bg);color:var(--accent)}
.cell.meal{background:var(--meal-bg)}
.cell.meal.dragover{background:var(--primary-soft)}
.cell.spanning{background:linear-gradient(180deg,var(--accent-soft),transparent 60%),var(--surface)}
.cell.spanning.meal{background:linear-gradient(180deg,var(--accent-soft),transparent 60%),var(--meal-bg)}
.item.tall{flex:1 1 auto;display:flex;flex-direction:column;border-left-width:5px;border-left-color:var(--accent)}
.item.tall .span-badge{margin-top:auto;align-self:flex-start;font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px}
.resize-guide{position:fixed;background:var(--primary-soft);border:2px dashed var(--primary);opacity:.7;border-radius:10px;z-index:150;pointer-events:none;box-shadow:var(--shadow)}
.item{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--primary);
  border-radius:10px;padding:8px 9px 12px;font-size:12.5px;position:relative;box-shadow:var(--shadow-sm);
  overflow:hidden;cursor:pointer;transition:box-shadow .15s;min-height:52px;
}
.item:hover{box-shadow:var(--shadow)}
.item.dragging{opacity:.45}
.item .it-title{font-weight:800;font-size:13px;line-height:1.35;padding-right:16px}
.item .it-desc{color:var(--muted);margin-top:3px;line-height:1.4;white-space:pre-wrap}
.item .it-hours{color:var(--accent);font-size:11px;margin-top:4px;font-weight:600}
.item .it-map{color:var(--primary);font-size:11px;margin-top:3px;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.item .grip{position:absolute;top:5px;right:6px;color:var(--muted);font-size:12px;cursor:grab;line-height:1;user-select:none}
.item .rz{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;display:flex;align-items:center;justify-content:center}
.item .rz::after{content:"";width:26px;height:3px;border-radius:2px;background:var(--line)}
.item:hover .rz::after{background:var(--muted)}
.add-item{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:5px;font-size:12px;font-weight:700;transition:.15s}
.add-item:hover{border-color:var(--accent2);color:var(--accent2);background:var(--accent-soft)}

/* ============ Checklist ============ */
.chk-wrap{max-width:1000px;margin:0 auto;padding:24px 22px 60px}
#chkPane{flex:1;overflow-y:auto;min-height:0;width:100%}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.chk-cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm)}
.chk-cat h3{font-size:15px;color:var(--primary);margin-bottom:12px;padding-bottom:8px;border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:7px}
.chk-item{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px}
.chk-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
.chk-item .txt{flex:1;outline:none;padding:2px 4px;border-radius:6px}
.chk-item .txt:focus{background:var(--bg)}
.chk-item.done .txt{text-decoration:line-through;color:var(--muted)}
.chk-item .x{opacity:0;border:none;background:transparent;color:var(--muted);font-size:15px;padding:2px 5px;border-radius:6px}
.chk-item:hover .x{opacity:1}
.chk-item .x:hover{background:#fbeae7;color:#c0392b}
.chk-add{margin-top:8px;width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:6px;font-size:13px;font-weight:700}
.chk-add:hover{border-color:var(--primary);color:var(--primary)}

/* ============ Modal ============ */
.overlay{position:fixed;inset:0;background:rgba(30,28,22,.42);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:480px;overflow:hidden;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:16px;font-weight:800}
.modal-head .sub{font-size:12px;color:var(--muted);margin-top:2px}
.modal-head .close{border:none;background:transparent;font-size:20px;color:var(--muted);width:32px;height:32px;border-radius:8px}
.modal-head .close:hover{background:var(--bg);color:var(--text)}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;max-height:64vh;overflow-y:auto}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;background:var(--bg);color:var(--text);transition:.15s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.field textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal-foot .spacer{flex:1}

/* 閱覽詳情 */
.view-block{font-size:14px;line-height:1.6}
.view-block .vb-label{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.view-block .vb-val{white-space:pre-wrap}
.view-block a{color:var(--primary)}
.ph-note{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--text)}

/* ===== Places 地點搜尋 + 代表圖 ===== */
.place-search{position:relative}
.place-picked{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--primary);background:var(--primary-soft);border-radius:9px;padding:7px 10px;margin-top:6px}
.place-picked .pp-clear{margin-left:auto;border:none;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;padding:0 4px}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:120;max-height:236px;overflow-y:auto}
.ac-item{padding:9px 12px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.active{background:var(--primary-soft)}
.ac-item .ac-main{font-weight:700}
.ac-item .ac-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.ac-empty{padding:10px 12px;font-size:12.5px;color:var(--muted)}
.pv-photo{width:100%;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line);margin-bottom:6px;min-height:130px;display:flex;align-items:center;justify-content:center}
.pv-photo img{width:100%;display:block}
.pv-photo .pv-load{color:var(--muted);font-size:13px;padding:34px 0;text-align:center;line-height:1.5}

/* Toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}

/* ============ 登入閘門 / 使用者 ============ */
.auth-gate{position:fixed;inset:0;z-index:300;background:linear-gradient(135deg,var(--primary),var(--accent2));display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--surface);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:38px 34px;max-width:380px;width:100%;text-align:center}
.auth-logo{font-family:"Dela Gothic One",serif;font-size:30px;color:var(--primary);margin-bottom:18px;letter-spacing:1px}
.auth-msg{font-size:15px;color:var(--text);line-height:1.6;margin-bottom:16px}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.auth-btn{width:100%;justify-content:center;padding:12px;font-size:15px}
.user-chip{display:flex;align-items:center;gap:8px}
.user-chip .uemail{font-size:12.5px;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.al-row span{flex:1;overflow:hidden;text-overflow:ellipsis}
.al-admin{background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;margin-left:6px}

/* ============ 手機版 RWD ============ */
/* iOS PWA 安全區：頂欄避開瀏海、底部避開 home indicator */
.topbar{padding-top:calc(12px + env(safe-area-inset-top));padding-left:calc(22px + env(safe-area-inset-left));padding-right:calc(22px + env(safe-area-inset-right))}
@media (max-width:640px){
  .topbar{padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));gap:8px;flex-wrap:nowrap}
  .brand{font-size:21px;letter-spacing:.5px}
  .theme-switch{gap:2px;padding:3px}
  .theme-btn{padding:7px 8px}
  .theme-btn .tlabel{display:none}                   /* 只留色點，省空間 */
  .theme-btn .dot{width:15px;height:15px}
  .user-chip{gap:5px}
  .user-chip .uemail{display:none}                   /* email 太長，手機隱藏 */
  #adminBtn .btn-label{display:none}                  /* 只留 👥，省空間 */
  .topbar .btn{white-space:nowrap}                    /* 防「登出」被壓成直排 */

  .wrap{padding:20px 14px calc(50px + env(safe-area-inset-bottom))}
  .page-title{font-size:22px}
  .page-sub{margin-bottom:18px}
  .card-grid{grid-template-columns:1fr;gap:14px}
  .trip-card .acts{opacity:1}                         /* 手機無 hover，編輯/刪除常駐 */

  /* 行程內頁頂列：名稱撐滿第一行，工具列自然折到第二行 */
  .trip-head{padding:10px 12px;gap:8px;flex-wrap:wrap}
  .trip-head .btn.ghost{padding:8px 9px}
  .trip-head > div:not(.tabs):not(.mode-switch):not(.dropdown):not(.spacer){flex:1 1 auto;min-width:0}
  .trip-head .tt{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trip-head .td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trip-head .spacer{display:none}
  /* 收成 2 行：第1行 返回+名稱+編輯/閱覽；第2行 日程Checklist+分享+儲存+匯出 */
  .trip-head .mode-switch{order:2}
  .trip-head .tabs{order:3}
  .trip-head #shareBtn{order:4}
  .trip-head #saveBtn{order:5}
  .trip-head #exportDD{order:6}
  .tabs,.mode-switch{padding:3px}
  .tab{padding:8px 12px;font-size:13px}
  .mode-btn{padding:8px 11px}
  .trip-head .btn{padding:8px 11px;font-size:13px}

  .sched-scroll{padding:0 0 calc(48px + env(safe-area-inset-bottom)) 0}
  .seg-label{min-width:56px;padding:10px 6px;font-size:12px}
  .corner .dh-date{font-size:11px}

  .chk-wrap{padding:18px 14px calc(50px + env(safe-area-inset-bottom))}
  .chk-grid{grid-template-columns:1fr;gap:14px}

  .overlay{padding:14px 10px}
  .modal{max-width:none}
  .modal-body{max-height:68vh}
  .row2{grid-template-columns:1fr}                    /* 表單欄位改單欄，好按 */
  .modal-foot{flex-wrap:wrap;gap:8px}
  .modal-foot .spacer{display:none}

<body data-theme="forest">

    </div>
    <div id="gateNoaccess" hidden>
      <p class="auth-msg">此帳號 <b id="gateEmail"></b><br>尚未被授權使用。</p>

<div class="topbar">

<!-- 首頁 -->
<div id="homeView" class="wrap">

<!-- 行程內頁 -->
<div id="tripView" hidden>

<!-- Modal 容器 -->
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 資料層 (Phase 1: localStorage) ================= */
const LS_KEY='travelPlanner_v1';
const SEGMENTS=['早餐前','早餐','早上','午餐','下午茶','下午','晚餐','晚上','住宿'];
const CHK_CATS=['重要事項','個人衣物','盥洗用品','3C產品','個人藥物','其他'];
const WD=['日','一','二','三','四','五','六'];
const COVER_EMOJI=['🏖️','🏔️','🌆','🗺️','🧳','🌸','🍜','⛩️'];

// Firebase 設定（公開金鑰，安全靠 Firestore 規則把關）
const FB_CONFIG={
  apiKey:"AIzaSyBVtLH6uKT3Tgew2Hvr6_SpxxT39lkQrCk",
  authDomain:"trip-genie-cccb2.firebaseapp.com",
  projectId:"trip-genie-cccb2",
  storageBucket:"trip-genie-cccb2.firebasestorage.app",
  messagingSenderId:"519815790357",
  appId:"1:519815790357:web:85203fca73d05800d8731c"
};
const ADMIN_EMAIL='maevemomo@gmail.com';
// Google Maps Platform 金鑰（前端公開，靠 Google Cloud 的 HTTP referrer 限制 + API 限制保護）
const MAPS_API_KEY='AIzaSyCn9X0U36Q6VzRwjbvi4iGEr84CJKun-gU';

let state=emptyState();
let cur={tripId:null, tab:'sched', mode:'edit'};
let cloud=false, db=null, auth=null, currentUser=null, isAdmin=false;
const CLIENT_ID=Math.random().toString(36).slice(2)+Date.now().toString(36);
let applyingRemote=false, appStarted=false;
let unsubOwner=null, unsubMember=null, tripsOwner={}, tripsMember={};
const saveTimers={};

function emptyState(){return {theme:'forest', trips:[], items:{}, checklist:{}};}
function normalizeState(){
  if(!state) state=emptyState();
  if(!state.items) state.items={}; if(!state.checklist) state.checklist={}; state.trips=state.trips||[];
  state.trips.forEach(t=>{ if(!state.items[t.id]) state.items[t.id]=[]; if(!state.checklist[t.id]) state.checklist[t.id]=blankChecklist(); });
}
function loadLocal(){
  try{const s=JSON.parse(localStorage.getItem(LS_KEY)); if(s&&s.trips) return s;}catch(e){}
  return emptyState();
}
function saveLocal(){ try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){console.warn(e);} }
function save(){
  if(applyingRemote) return;
  if(cur.tripId) scheduleTrip(cur.tripId);   // 只存目前開啟的那趟
  else if(!cloud) saveLocal();               // 首頁層在雲端由各 CRUD 直接寫；本機模式存 blob
}
function scheduleTrip(id){
  if(!cloud){ saveLocal(); return; }
  clearTimeout(saveTimers[id]); saveTimers[id]=setTimeout(()=>{ delete saveTimers[id]; persistTrip(id); },400);
}
function tripDoc(t){
  return {
    name:t.name, startDate:t.startDate, endDate:t.endDate, theme:t.theme||'forest',
    emoji:t.emoji||'🗺️', order:t.order||0,
    owner:t.owner||(currentUser?currentUser.email:''), members:t.members||[],
    items:state.items[t.id]||[], checklist:state.checklist[t.id]||blankChecklist(),
    writer:CLIENT_ID, updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
    updatedBy:currentUser?currentUser.email:''
  };
}
function persistTrip(id){
  if(!cloud){ saveLocal(); return; }
  const t=state.trips.find(x=>x.id===id); if(!t) return;
  db.collection('trips').doc(id).set(tripDoc(t)).catch(e=>toast('儲存失敗：'+(e.code||e.message)));
}
function deleteTripDoc(id){
  if(!cloud){ saveLocal(); return; }
  db.collection('trips').doc(id).delete().catch(e=>toast('刪除失敗：'+(e.code||e.message)));
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ================= 主題 ================= */
const THEME_COLOR={forest:'#2C6E49',ocean:'#2A6E96',city:'#2F5D8A'};
function applyTheme(t, doSave){
  state.theme=t; document.body.setAttribute('data-theme',t);
  document.querySelectorAll('#themeSwitch .theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  const mt=document.getElementById('metaTheme'); if(mt&&THEME_COLOR[t]) mt.setAttribute('content',THEME_COLOR[t]);
  if(doSave!==false) save();   // 只有使用者主動切換才寫回；重繪/開啟時套用主題不寫回（避免多裝置互相觸發同步迴圈→跳動）
}
document.getElementById('themeSwitch').addEventListener('click',e=>{
  const b=e.target.closest('.theme-btn'); if(!b)return;
  const t=b.dataset.t; applyTheme(t);
  if(cur.tripId){ state.trips.find(x=>x.id===cur.tripId).theme=t; save(); }
});

/* ================= 首頁卡片牆 ================= */
function renderHome(){
  const g=document.getElementById('cardGrid'); g.innerHTML='';
  state.trips.forEach((t,i)=>{
    const card=document.createElement('div'); card.className='trip-card';
    card.onclick=()=>openTrip(t.id);
    card.innerHTML=`
      <div class="cover"><span class="emoji">${t.emoji||COVER_EMOJI[i%COVER_EMOJI.length]}</span></div>
      <div class="acts">
        <button class="mini-btn" title="編輯" onclick="event.stopPropagation();editTrip('${t.id}')">✎</button>
        <button class="mini-btn del" title="刪除" onclick="event.stopPropagation();deleteTrip('${t.id}')">🗑</button>
      </div>
      <div class="body">
        <div class="tname">${esc(t.name)||'未命名行程'}</div>
        <div class="tdate">🗓 ${fmtRange(t.startDate,t.endDate)}</div>
        <div class="tmeta">${dayCount(t.startDate,t.endDate)} 天 · ${(state.items[t.id]||[]).length} 個行程</div>
      </div>`;
    g.appendChild(card);
  });
  const add=document.createElement('div'); add.className='add-card'; add.onclick=()=>editTrip(null);
  add.innerHTML=`<div class="plus">+</div><div>新增行程</div>`;
  g.appendChild(add);
  if(state.trips.length===0){
    // 仍顯示新增卡；下方小提示
  }
}

/* ================= 行程 CRUD ================= */
function editTrip(id){
  const t = id ? state.trips.find(x=>x.id===id) : {name:'',startDate:'',endDate:'',theme:state.theme};
  const isNew=!id;
  openModal(`
    <div class="modal-head"><div><h2>${isNew?'新增行程':'編輯行程'}</h2></div>
      <button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>行程名稱</label><input id="f_name" value="${esc(t.name)}" placeholder="例：馬來西亞婚禮之旅"></div>
      <div class="row2">
        <div class="field"><label>起日</label><input type="date" id="f_start" value="${t.startDate||''}"></div>
        <div class="field"><label>迄日</label><input type="date" id="f_end" value="${t.endDate||''}"></div>
      </div>
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveTrip('${id||''}')">${isNew?'建立':'儲存'}</button>
    </div>`);
  setTimeout(()=>document.getElementById('f_name').focus(),50);
}
function saveTrip(id){
  const name=document.getElementById('f_name').value.trim();
  const s=document.getElementById('f_start').value, e=document.getElementById('f_end').value;
  if(!name){toast('請輸入行程名稱');return;}
  if(!s||!e){toast('請選擇起訖日期');return;}
  if(s>e){toast('迄日不可早於起日');return;}
  if(id){
    const t=state.trips.find(x=>x.id===id); Object.assign(t,{name,startDate:s,endDate:e});
    if(cloud) persistTrip(id); else save();
  }else{
    const nid=uid();
    state.trips.push({id:nid,name,startDate:s,endDate:e,theme:state.theme,emoji:COVER_EMOJI[state.trips.length%COVER_EMOJI.length],owner:(currentUser?currentUser.email:''),members:[]});
    state.items[nid]=[]; state.checklist[nid]=blankChecklist();
    if(cloud) persistTrip(nid); else save();
  }
  closeModal(); renderHome(); toast(id?'已更新':'行程已建立');
}
function deleteTrip(id){
  const t=state.trips.find(x=>x.id===id);
  confirmModal(`刪除「${esc(t.name)}」？`,'此行程的所有日程與 Checklist 會一併刪除，無法復原。',()=>{
    state.trips=state.trips.filter(x=>x.id!==id); delete state.items[id]; delete state.checklist[id];
    if(cloud) deleteTripDoc(id); else save();
    renderHome(); toast('已刪除');
  });
}
function blankChecklist(){const o={};CHK_CATS.forEach(c=>o[c]=[]);return o;}

/* ================= 開行程內頁 ================= */
function openTrip(id){
  cur.tripId=id; cur.tab='sched'; cur.mode='edit';
  const t=state.trips.find(x=>x.id===id);
  if(t.theme) applyTheme(t.theme, false);
  if(!state.items[id]) state.items[id]=[];
  if(!state.checklist[id]) state.checklist[id]=blankChecklist();
  document.getElementById('homeView').hidden=true;
  document.getElementById('tripView').hidden=false;
  document.getElementById('tripName').textContent=t.name;
  document.getElementById('tripDate').textContent=`${fmtRange(t.startDate,t.endDate)} · ${dayCount(t.startDate,t.endDate)} 天`;
  const owner=(cloud && currentUser && t.owner===currentUser.email);
  document.getElementById('shareBtn').hidden=!owner;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='sched'));
  document.getElementById('schedPane').hidden=false; document.getElementById('chkPane').hidden=true;
  setMode('edit');
  renderSched();
}
function goHome(){cur.tripId=null;document.getElementById('tripView').hidden=true;document.getElementById('homeView').hidden=false;renderHome();}
function switchTab(tab){
  cur.tab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.getElementById('schedPane').hidden=(tab!=='sched');
  document.getElementById('chkPane').hidden=(tab!=='chk');
  if(tab==='chk') renderChecklist(); else renderSched();
}
function setMode(m){
  cur.mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.m===m));
  if(cur.tab==='sched') renderSched(); else renderChecklist();
}

/* ================= 日程 grid ================= */
function tripDays(t){
  const days=[]; let d=new Date(t.startDate+'T00:00:00'); const end=new Date(t.endDate+'T00:00:00');
  while(d<=end){ days.push(fmtDate(d)); d.setDate(d.getDate()+1); }
  return days;
}
const MEALS=['早餐','午餐','晚餐'];
function renderSched(){
  const t=state.trips.find(x=>x.id===cur.tripId); if(!t)return;
  const days=tripDays(t);
  const pane=document.getElementById('schedPane');
  const grid=document.createElement('div'); grid.className='sched';
  const narrow=window.innerWidth<=640;
  // 桌機：minmax(0,1fr) 讓各天欄自動平分、填滿螢幕、不論天數都不橫捲
  // 手機：固定較寬欄，可左右橫捲看不同天
  grid.style.gridTemplateColumns = narrow
    ? `56px repeat(${days.length}, minmax(203px,1fr))`
    : `76px repeat(${days.length}, minmax(0,1fr))`;
  grid.style.gridTemplateRows=`auto repeat(${SEGMENTS.length}, auto)`;
  // 表頭
  const corner=document.createElement('div'); corner.className='corner';
  corner.style.gridColumn='1'; corner.style.gridRow='1';
  corner.innerHTML=''; grid.appendChild(corner);
  days.forEach((dt,di)=>{
    const dd=new Date(dt+'T00:00:00');
    const h=document.createElement('div'); h.className='day-head';
    h.style.gridColumn=(di+2); h.style.gridRow='1';
    h.innerHTML=`<div class="dh-date">${(dd.getMonth()+1)}/${dd.getDate()} (${WD[dd.getDay()]})</div><div class="dh-loc"></div>`;
    grid.appendChild(h);
  });
  const items=state.items[cur.tripId]||[];
  // 被跨段長卡覆蓋的格子（同日、起始段下方 span-1 段）
  const covered=new Set();
  items.forEach(it=>{const sp=it.spanSegments||1;if(sp>1){const si=SEGMENTS.indexOf(it.segment);for(let k=1;k<sp&&si+k<SEGMENTS.length;k++)covered.add(it.dayDate+'|'+(si+k));}});
  // 段標籤 + 各日格
  SEGMENTS.forEach((seg,si)=>{
    const lab=document.createElement('div'); lab.className='seg-label'+(MEALS.includes(seg)?' meal':'');
    lab.textContent=seg; lab.style.gridColumn='1'; lab.style.gridRow=(si+2); grid.appendChild(lab);
    days.forEach((dt,di)=>{
      if(covered.has(dt+'|'+si)) return; // 被上方長卡覆蓋，不畫
      const list=items.filter(it=>it.dayDate===dt&&it.segment===seg).sort((a,b)=>a.orderInSegment-b.orderInSegment);
      let cellSpan=1; list.forEach(it=>{const sp=Math.min(it.spanSegments||1,SEGMENTS.length-si);if(sp>cellSpan)cellSpan=sp;});
      const cell=document.createElement('div'); cell.className='cell'+(MEALS.includes(seg)?' meal':'')+(cellSpan>1?' spanning':'');
      cell.dataset.day=dt; cell.dataset.seg=seg;
      cell.style.gridColumn=(di+2); cell.style.gridRow=`${si+2} / span ${cellSpan}`;
      list.forEach(it=>cell.appendChild(renderItem(it,si)));
      if(cur.mode==='edit' && cellSpan===1){
        const add=document.createElement('button'); add.className='add-item'; add.textContent='＋ 新增';
        add.onclick=()=>editItem(null,dt,seg); cell.appendChild(add);
      }
      setupDrop(cell);
      grid.appendChild(cell);
    });
  });
  pane.innerHTML=''; pane.appendChild(grid);
}
function renderItem(it,startIdx){
  const span=Math.min(it.spanSegments||1, SEGMENTS.length-(startIdx??SEGMENTS.indexOf(it.segment)));
  const box=document.createElement('div'); box.className='item'+(span>1?' tall':''); box.dataset.id=it.id;
  let html=`<div class="it-title">${esc(it.title)||'（未命名地點）'}</div>`;
  if(it.desc) html+=`<div class="it-desc">${esc(it.desc)}</div>`;
  if(it.hours||it.closedDay){
    const parts=[]; if(it.closedDay)parts.push(it.closedDay); if(it.hours)parts.push(it.hours);
    html+=`<div class="it-hours">🕐 ${esc(parts.join('，'))}</div>`;
  }
  if(span>1 && cur.mode==='edit'){const si=SEGMENTS.indexOf(it.segment);html+=`<span class="span-badge">↕ ${SEGMENTS[si]}－${SEGMENTS[Math.min(si+span-1,SEGMENTS.length-1)]}（跨 ${span} 段）</span>`;}
  if(cur.mode==='edit'){
    html+=`<span class="grip" title="拖曳移動">⠿</span><div class="rz" title="往下拉可跨時間段"></div>`;
  }
  box.innerHTML=html;
  box.onclick=(e)=>{ if(box.dataset.resizing)return; if(cur.mode==='edit') editItem(it.id); else viewItem(it.id); };
  if(cur.mode==='edit'){
    box.draggable=true;
    box.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',it.id);box.classList.add('dragging');});
    box.addEventListener('dragend',()=>box.classList.remove('dragging'));
    setupResize(box,it);
  }
  return box;
}
function setupDrop(cell){
  cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('dragover');});
  cell.addEventListener('dragleave',()=>cell.classList.remove('dragover'));
  cell.addEventListener('drop',e=>{
    e.preventDefault();cell.classList.remove('dragover');
    const id=e.dataTransfer.getData('text/plain'); if(!id)return;
    const it=state.items[cur.tripId].find(x=>x.id===id); if(!it)return;
    const targetSeg=cell.dataset.seg, targetDay=cell.dataset.day;
    // 計算插入位置（放在滑鼠下方最近的 item 之前）
    const boxes=[...cell.querySelectorAll('.item')].filter(b=>b.dataset.id!==id);
    let insertBefore=null;
    for(const b of boxes){const r=b.getBoundingClientRect(); if(e.clientY < r.top+r.height/2){insertBefore=b.dataset.id;break;}}
    it.dayDate=targetDay; it.segment=targetSeg;
    reorderSegment(targetDay,targetSeg,id,insertBefore);
    save(); renderSched();
  });
}
function reorderSegment(day,seg,movedId,beforeId){
  let list=state.items[cur.tripId].filter(x=>x.dayDate===day&&x.segment===seg&&x.id!==movedId)
            .sort((a,b)=>a.orderInSegment-b.orderInSegment);
  const moved=state.items[cur.tripId].find(x=>x.id===movedId);
  const idx = beforeId ? list.findIndex(x=>x.id===beforeId) : list.length;
  list.splice(idx<0?list.length:idx,0,moved);
  list.forEach((x,i)=>x.orderInSegment=i);
}
// 拖底部灰桿：往下拉可讓行程「跨越多個時間段」（例如水族館一日遊佔早餐~下午）
function setupResize(box,it){
  const rz=box.querySelector('.rz'); if(!rz)return;
  rz.addEventListener('mousedown',e=>{
    e.preventDefault();e.stopPropagation();box.dataset.resizing='1';box.draggable=false;
    const startIdx=SEGMENTS.indexOf(it.segment);
    // 抓各時間段列的垂直範圍（畫面座標），拖曳過程不改版面避免抖動
    const ranges=[...document.querySelectorAll('.sched .seg-label')].map((l)=>{const r=l.getBoundingClientRect();return {top:r.top,bottom:r.bottom};});
    const boxRect=box.getBoundingClientRect();
    const colRect=(box.closest('.cell')||box).getBoundingClientRect();
    const guide=document.createElement('div'); guide.className='resize-guide'; document.body.appendChild(guide);
    function targetIdxOf(y){let idx=startIdx;ranges.forEach((r,i)=>{if(i>=startIdx && y>=r.top)idx=i;});return idx;}
    function draw(y){
      const ti=targetIdxOf(y); const bottom=ranges[ti]?ranges[ti].bottom:y;
      guide.style.left=colRect.left+3+'px'; guide.style.width=(colRect.width-6)+'px';
      guide.style.top=boxRect.top+'px'; guide.style.height=Math.max(24,(Math.max(y,bottom)-boxRect.top))+'px';
    }
    function mv(ev){draw(ev.clientY);}
    function up(ev){
      document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);guide.remove();
      const ti=targetIdxOf(ev.clientY);
      it.spanSegments=Math.max(1, Math.min(ti-startIdx+1, SEGMENTS.length-startIdx));
      box.draggable=true; setTimeout(()=>delete box.dataset.resizing,50);
      save(); renderSched();
    }
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up); draw(e.clientY);
  });
}

/* ================= Places API (New)：地點搜尋 + 代表圖 ================= */
const PLACES_BASE='https://places.googleapis.com/v1';
const PHOTO_TTL=30*864e5;          // 代表圖快照 30 天後才刷新（合規＋省配額）
const PHOTO_MAXW=640;              // 大圖寬度（壓縮後存 base64；詳情頁顯示區 <480px，640 綽綽有餘又省空間）
let curEditPlace=null;             // 編輯視窗當前選定地點 {placeId, photoName}
const photoMemCache={};            // itemId → dataUrl（同一次 App 內記憶體快取，再開同地點免讀 Firestore、免閃「載入中」）
let acSession=null, acTimer=null, acActiveIdx=-1, acCurrent=[];

function newSession(){ return uid()+uid(); }
async function placesAutocomplete(input){
  const res=await fetch(PLACES_BASE+'/places:autocomplete',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Goog-Api-Key':MAPS_API_KEY},
    body:JSON.stringify({input, languageCode:'zh-TW', regionCode:'TW', sessionToken:acSession})
  });
  if(!res.ok) throw new Error('autocomplete '+res.status);
  const d=await res.json();
  return (d.suggestions||[]).map(s=>s.placePrediction).filter(Boolean);
}
async function placeDetails(placeId){
  const url=PLACES_BASE+'/places/'+encodeURIComponent(placeId)+'?languageCode=zh-TW'+(acSession?('&sessionToken='+encodeURIComponent(acSession)):'');
  const res=await fetch(url,{headers:{'X-Goog-Api-Key':MAPS_API_KEY,'X-Goog-FieldMask':'id,displayName,googleMapsUri,formattedAddress,photos'}});
  if(!res.ok) throw new Error('details '+res.status);
  return res.json();
}
// photoName 例：places/XXX/photos/YYY → 取實際短期 URL 再壓成 jpeg base64
async function fetchPhotoDataUrl(photoName){
  const url=PLACES_BASE+'/'+photoName+'/media?maxWidthPx='+PHOTO_MAXW+'&skipHttpRedirect=true&key='+MAPS_API_KEY;
  const res=await fetch(url); if(!res.ok) throw new Error('photo '+res.status);
  const d=await res.json();       // {name, photoUri}
  return imgToJpegDataUrl(d.photoUri, PHOTO_MAXW, 0.6);
}
function imgToJpegDataUrl(src,maxW,q){
  return new Promise((resolve,reject)=>{
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{
      const scale=Math.min(1, maxW/(img.naturalWidth||maxW));
      const w=Math.round((img.naturalWidth||maxW)*scale), h=Math.round((img.naturalHeight||maxW)*scale);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      try{ resolve(c.toDataURL('image/jpeg',q)); }catch(e){ reject(e); }
    };
    img.onerror=()=>reject(new Error('img load fail'));
    img.src=src;
  });
}
// 代表圖快照：獨立子文件 trips/{tripId}/photos/{itemId}（不塞主文件，避開 1MiB 上限）
function photoRef(tripId,itemId){ return db.collection('trips').doc(tripId).collection('photos').doc(itemId); }
async function getPhotoDoc(tripId,itemId){
  if(!cloud) return null;
  try{ const s=await photoRef(tripId,itemId).get(); return s.exists?s.data():null; }catch(e){ return null; }
}
async function savePhotoDoc(tripId,itemId,dataUrl,placeId){
  if(!cloud) return;
  try{ await photoRef(tripId,itemId).set({dataUrl, placeId, fetchedAt:firebase.firestore.FieldValue.serverTimestamp()}); }catch(e){ console.warn('savePhoto',e); }
}
async function deletePhotoDoc(tripId,itemId){
  delete photoMemCache[itemId];
  if(!cloud) return;
  try{ await photoRef(tripId,itemId).delete(); }catch(e){}
}
// 回傳可顯示的大圖 dataUrl：優先讀 30 天內快照；過期/無則抓一次並落地
async function ensurePhoto(tripId,item,force){
  if(!item||!item.placeId||!item.photoName) return null;
  if(!force && photoMemCache[item.id]) return photoMemCache[item.id];   // 記憶體命中，連 Firestore 都免
  const existing=await getPhotoDoc(tripId,item.id);
  if(!force && existing && existing.dataUrl && existing.placeId===item.placeId && existing.fetchedAt){
    const age=Date.now()-existing.fetchedAt.toMillis();
    if(age<PHOTO_TTL){ photoMemCache[item.id]=existing.dataUrl; return existing.dataUrl; }   // 命中 Firestore 快照，0 API
  }
  try{
    const dataUrl=await fetchPhotoDataUrl(item.photoName);   // 首次或過期才真正呼叫 Google
    await savePhotoDoc(tripId,item.id,dataUrl,item.placeId);
    photoMemCache[item.id]=dataUrl;
    return dataUrl;
  }catch(e){ console.warn('ensurePhoto fetch fail',e); return existing?existing.dataUrl:null; }
}

function saveItem(id){
  const items=state.items[cur.tripId];
  const v=k=>document.getElementById(k).value.trim();
  const title=v('f_title');
  if(!title){toast('請輸入地點');return;}
  const day=document.getElementById('f_day').value, seg=document.getElementById('f_seg').value;
  const placeId=curEditPlace?curEditPlace.placeId:'', photoName=curEditPlace?(curEditPlace.photoName||''):'';
  const data={title,desc:v('f_desc'),closedDay:v('f_closed'),hours:v('f_hours'),mapUrl:v('f_map'),dayDate:day,segment:seg,placeId,photoName};
  let savedItem;
  if(id){
    const it=items.find(x=>x.id===id); const segChanged=(it.segment!==seg||it.dayDate!==day);
    const placeChanged=(it.placeId!==placeId);
    Object.assign(it,data);
    if(segChanged){const cnt=items.filter(x=>x.dayDate===day&&x.segment===seg&&x.id!==id).length;it.orderInSegment=cnt;}
    if(placeChanged && !placeId) deletePhotoDoc(cur.tripId, id);  // 清除了地點 → 刪舊快照
    savedItem=it;
  }else{
    const cnt=items.filter(x=>x.dayDate===day&&x.segment===seg).length;
    savedItem={id:uid(),...data,orderInSegment:cnt,spanSegments:1}; items.push(savedItem);
  }
  save(); closeModal(); renderSched(); toast('已儲存');
  // 背景抓代表圖（首次或地點變更；命中 30 天快照則不呼叫 API）
  if(savedItem && savedItem.placeId && savedItem.photoName){
    ensurePhoto(cur.tripId, savedItem).catch(()=>{});
  }
}

  const theme=(t&&t.theme&&EXPORT_THEME_VARS[t.theme])?t.theme:'forest';
  const V=EXPORT_THEME_VARS[theme];
  const varLines=Object.keys(V).map(k=>'--'+k+':'+V[k]).join(';');
  const days=tripDays(t);
  const now=new Date();
  const exportedAt=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate();

  // 逐日 → 逐段（只列有內容的段，依 SEGMENTS 順序）
  const daysHtml=days.map(dt=>{
    const dd=new Date(dt+'T00:00:00');
    const dayLabel=(dd.getMonth()+1)+'/'+dd.getDate()+' ('+WD[dd.getDay()]+')';
    const segsHtml=SEGMENTS.map(seg=>{
      const list=items.filter(it=>it.dayDate===dt&&it.segment===seg).sort((a,b)=>(a.orderInSegment||0)-(b.orderInSegment||0));
      if(!list.length) return '';
      const isMeal=MEALS.includes(seg);
      const cards=list.map(it=>{
        const span=it.spanSegments||1;
        const si=SEGMENTS.indexOf(it.segment);
        const spanNote=span>1?` <span class="span-note">↕ ${esc(SEGMENTS[si])}－${esc(SEGMENTS[Math.min(si+span-1,SEGMENTS.length-1)])}</span>`:'';
        const rows=[];
        if(it.desc) rows.push(`<div class="c-desc">${esc(it.desc)}</div>`);
        const timeStr=[it.closedDay,it.hours].filter(Boolean).join('，');
        if(timeStr) rows.push(`<div class="c-meta">🕐 ${esc(timeStr)}</div>`);
        if(it.mapUrl) rows.push(`<div class="c-meta"><a href="${esc(it.mapUrl)}" target="_blank" rel="noopener">📍 在 Google Maps 開啟</a></div>`);
        const photo=photos[it.id];
        const photoHtml=photo?`<div class="c-photo"><img src="${photo}" alt="${esc(it.title)||'代表圖'}" loading="lazy"></div>`:'';
        return `<article class="card">
          <div class="c-body"><h3 class="c-title">${esc(it.title)||'（未命名地點）'}${spanNote}</h3>${rows.join('')}</div>
          ${photoHtml}
        </article>`;
      }).join('');
      return `<div class="seg${isMeal?' meal':''}"><div class="seg-name">${esc(seg)}</div><div class="seg-cards">${cards}</div></div>`;
    }).join('');
    const empty=segsHtml?'':'<div class="day-empty">（本日尚未安排行程）</div>';
    return `<section class="day"><h2 class="day-h">${dayLabel}</h2>${segsHtml}${empty}</section>`;
  }).join('');

  // Checklist（靜態勾選，☑/☐；只列有項目的類別）
  const cl=checklist||{};
  const chkCats=CHK_CATS.map(cat=>{
    const arr=cl[cat]||[]; if(!arr.length) return '';
    const lis=arr.map(x=>`<li class="${x.checked?'done':''}"><span class="box">${x.checked?'☑':'☐'}</span><span class="t">${esc(x.text)}</span></li>`).join('');
    return `<div class="chk-cat"><h3>${CHK_ICON[cat]||''} ${esc(cat)}</h3><ul>${lis}</ul></div>`;
  }).join('');
  const chkHtml=chkCats?`<section class="checklist"><h2 class="sec-h">🧳 行前 Checklist</h2><div class="chk-grid">${chkCats}</div></section>`:'';

  const printScript=forPrint?'<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},350);});<\/script>':'';

  return `<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(t.name||'行程表')} · 行程表</title>
<style>
:root{${varLines};--radius:14px}

html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact}

</header>
<main>

${chkHtml}
</main>
<footer class="doc-foot">由 <strong>Trip Genie</strong> 匯出的靜態行程快照 · <a href="https://trip-genie-cccb2.firebaseapp.com/" target="_blank" rel="noopener">trip-genie-cccb2.firebaseapp.com</a></footer>

}

async function prepExport(){
  if(!cur.tripId){ toast('請先開啟一個行程再匯出'); return null; }
  const t=state.trips.find(x=>x.id===cur.tripId); if(!t){ toast('找不到行程'); return null; }
  const items=state.items[cur.tripId]||[];
  const checklist=state.checklist[cur.tripId]||blankChecklist();
  const photos=await gatherExportPhotos(cur.tripId,items);
  return {t,items,checklist,photos};
}

async function exportHTML(){
  toast('產生 HTML 快照中…');
  try{
    const d=await prepExport(); if(!d) return;
    const html=buildSnapshotHTML(d.t,d.items,d.checklist,d.photos,false);
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=exportFileName(d.t,'html');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('✓ 已匯出 HTML（可離線開啟／寄送）');
  }catch(e){ console.warn('exportHTML',e); toast('匯出 HTML 失敗：'+(e.message||e)); }
}

async function exportPDF(){
  // 先同步開視窗（保住 user gesture，避免 await 後被彈窗攔截）
  const w=window.open('','_blank');
  if(!w){ toast('請允許彈出視窗，才能列印 PDF'); return; }
  try{
    w.document.write('<!doctype html><meta charset="utf-8"><title>產生中…</title><body style="font-family:sans-serif;padding:40px;color:#555">產生 PDF 快照中，請稍候…</body>');
  }catch(_){}
  toast('產生 PDF 快照中…');
  try{
    const d=await prepExport();
    if(!d){ w.close(); return; }
    const html=buildSnapshotHTML(d.t,d.items,d.checklist,d.photos,true);
    w.document.open(); w.document.write(html); w.document.close();
    toast('✓ 已開啟列印，於對話框選「另存為 PDF」');
  }catch(e){ try{w.close();}catch(_){}; console.warn('exportPDF',e); toast('匯出 PDF 失敗：'+(e.message||e)); }
}

/* ================= 小工具 ================= */
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtRange(s,e){ if(!s||!e)return '未設定日期'; const a=new Date(s+'T00:00:00'),b=new Date(e+'T00:00:00');
  return `${a.getFullYear()}/${a.getMonth()+1}/${a.getDate()} – ${b.getMonth()+1}/${b.getDate()}`; }
function fmtDay(d){const dd=new Date(d+'T00:00:00');return `${dd.getMonth()+1}/${dd.getDate()} (${WD[dd.getDay()]})`;}
function dayCount(s,e){ if(!s||!e)return 0; return Math.round((new Date(e)-new Date(s))/864e5)+1; }

/* ================= 啟動 ================= */
/* ================= Firebase 登入 / 雲端啟動 ================= */
function showGate(mode){
  document.getElementById('authGate').hidden=false;
  document.getElementById('gateLoading').hidden=(mode!=='loading');
  document.getElementById('gateSignin').hidden=(mode!=='signin');
  document.getElementById('gateNoaccess').hidden=(mode!=='noaccess');
}
function hideGate(){ document.getElementById('authGate').hidden=true; }
function doSignIn(){
  const p=new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:'select_account'});
  // 純彈窗登入（同網域最穩，iOS Safari 對 redirect 會壞：missing initial state）
  auth.signInWithPopup(p).catch(e=>{
    showGate('signin');
    if(e.code==='auth/popup-blocked') toast('請到 Safari 設定關閉「阻擋彈出式視窗」後再試');
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request') toast('登入失敗：'+(e.code||e.message));
  });
}
function doSignOut(){ if(auth) auth.signOut(); }

async function onAuth(user){
  if(!user){ currentUser=null; document.getElementById('userChip').hidden=true; showGate('signin'); return; }
  currentUser=user; showGate('loading');
  let allowed=false;
  if(user.email===ADMIN_EMAIL){
    allowed=true;   // 管理員直接放行，不等權限文件（避免載入卡住）
    db.collection('config').doc('access').get().then(a=>{ if(!a.exists) db.collection('config').doc('access').set({admin:ADMIN_EMAIL,allowlist:[]}); }).catch(()=>{});
  } else {
    try{
      const acc=await db.collection('config').doc('access').get();
      if(acc.exists){ const d=acc.data(); allowed=Array.isArray(d.allowlist)&&d.allowlist.includes(user.email); }
    }catch(e){ toast('讀取權限失敗：'+(e.code||e.message)); }
  }
  if(!allowed){ document.getElementById('gateEmail').textContent=user.email; document.getElementById('userChip').hidden=true; showGate('noaccess'); return; }
  isAdmin=(user.email===ADMIN_EMAIL);
  document.getElementById('uEmail').textContent=user.email;
  document.getElementById('uEmail').title=user.email;
  document.getElementById('adminBtn').hidden=!isAdmin;
  document.getElementById('userChip').hidden=false;
  hideGate(); startCloud();
  setTimeout(()=>{ if(!appStarted) bootUI(); }, 6000);   // 保險：資料若卡住也先顯示首頁
}
function startCloud(){
  const em=currentUser.email;
  if(unsubOwner) unsubOwner(); if(unsubMember) unsubMember();
  const onErr=e=>{ toast('雲端連線失敗：'+(e.code||e.message)); if(!appStarted) bootUI(); };
  // 我擁有的行程
  unsubOwner=db.collection('trips').where('owner','==',em)
    .onSnapshot(s=>{ tripsOwner={}; s.forEach(d=>tripsOwner[d.id]=d.data()); mergeTrips(allOwn(s)); }, onErr);
  // 別人分享給我的行程
  unsubMember=db.collection('trips').where('members','array-contains',em)
    .onSnapshot(s=>{ tripsMember={}; s.forEach(d=>tripsMember[d.id]=d.data()); mergeTrips(allOwn(s)); }, onErr);
}
function allOwn(snap){ const ch=snap.docChanges(); return ch.length>0 && ch.every(c=>c.doc.data().writer===CLIENT_ID); }
function mergeTrips(ownOnly){
  const byId=Object.assign({}, tripsMember, tripsOwner);   // owner 版本優先
  const openId=cur.tripId;
  const keepOpen = openId && (saveTimers[openId] || document.getElementById('overlay').classList.contains('show'));
  const trips=[], items={}, chk={};
  Object.keys(byId).forEach(id=>{
    const d=byId[id];
    trips.push({id, name:d.name, startDate:d.startDate, endDate:d.endDate, theme:d.theme, emoji:d.emoji, order:d.order||0, owner:d.owner, members:d.members||[]});
    if(id===openId && keepOpen){ items[id]=state.items[id]||d.items||[]; chk[id]=state.checklist[id]||d.checklist||blankChecklist(); }
    else { items[id]=d.items||[]; chk[id]=d.checklist||blankChecklist(); }
  });
  trips.sort((a,b)=>((a.order||0)-(b.order||0))||((a.name||'')>(b.name||'')?1:-1));
  applyingRemote=true; state.trips=trips; state.items=items; state.checklist=chk; applyingRemote=false;
  if(!appStarted) bootUI();
  else if(!ownOnly) rerenderCurrent();   // 只有別人改動才重繪，自己寫的不重繪（避免跳動）
}
function bootUI(){ appStarted=true; normalizeState(); applyTheme(state.theme||'forest', false); if(cur.tripId) rerenderCurrent(); else renderHome(); }
function rerenderCurrent(){
  applyTheme(state.theme||'forest', false);
  if(cur.tripId){
    const t=state.trips.find(x=>x.id===cur.tripId);
    if(!t){ goHome(); return; }
    document.getElementById('tripName').textContent=t.name;
    document.getElementById('tripDate').textContent=`${fmtRange(t.startDate,t.endDate)} · ${dayCount(t.startDate,t.endDate)} 天`;
    if(cur.tab==='sched') renderSched(); else renderChecklist();
  } else renderHome();
}

async function openAdmin(){
  if(!isAdmin) return;
  let d={admin:ADMIN_EMAIL,allowlist:[]};
  try{ const acc=await db.collection('config').doc('access').get(); if(acc.exists) d=acc.data(); }catch(e){}
  const list=(d.allowlist||[]);
  const rows=list.length?list.map(e=>`<div class="al-row"><span>${esc(e)}</span><button class="btn danger sm" onclick="removeAllow('${esc(e)}')">移除</button></div>`).join('')
                        :'<div style="color:var(--muted);font-size:13px;padding:8px 0">尚無授權團員</div>';
  openModal(`
    <div class="modal-head"><div><h2>👥 App 成員（誰能登入）</h2><div class="sub">管理員：${esc(d.admin||ADMIN_EMAIL)}</div></div><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="ph-note">這裡只決定「誰能登入 Trip Genie」。<b>加入後對方登入本身看不到任何行程</b>；要讓他看到某趟行程，還要進那趟行程按「🔗 分享」個別加入。</div>
      <div class="field"><label>新增可登入的 Gmail</label>
        <div style="display:flex;gap:8px"><input id="al_email" type="email" placeholder="family@gmail.com" style="flex:1"><button class="btn primary" onclick="addAllow()">新增</button></div>
      </div>
      <div><div style="font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:4px">可登入成員</div>${rows}</div>
    </div>
    <div class="modal-foot"><div class="spacer"></div><button class="btn primary" onclick="closeModal()">完成</button></div>`);
  setTimeout(()=>document.getElementById('al_email')?.focus(),50);
}
function addAllow(){
  const email=(document.getElementById('al_email').value||'').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('請輸入正確的 Email'); return; }
  db.collection('config').doc('access').set({admin:ADMIN_EMAIL,allowlist:firebase.firestore.FieldValue.arrayUnion(email)},{merge:true})
    .then(()=>{ toast('已新增 '+email); openAdmin(); }).catch(e=>toast('新增失敗：'+(e.code||e.message)));
}
function removeAllow(email){
  db.collection('config').doc('access').set({allowlist:firebase.firestore.FieldValue.arrayRemove(email)},{merge:true})
    .then(()=>{ toast('已移除 '+email); openAdmin(); }).catch(e=>toast('移除失敗：'+(e.code||e.message)));
}

  openModal(`

    <div class="modal-body">
      <div class="field"><label>加入可檢視／編輯的 Gmail</label>
        <div style="display:flex;gap:8px"><input id="mb_email" type="email" placeholder="family@gmail.com" style="flex:1"><button class="btn primary" onclick="addMember()">加入</button></div>
      </div>
      <div><div style="font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:4px">目前分享對象</div>${rows}</div>
      <div class="ph-note">對方需先在「👥 App 成員」清單內（才能登入 Trip Genie）；登入後他只會看到分享給他的行程，看不到你其他行程。<br>網址：<b>trip-genie-cccb2.firebaseapp.com</b></div>
    </div>
    <div class="modal-foot"><div class="spacer"></div><button class="btn primary" onclick="closeModal()">完成</button></div>`);
  setTimeout(()=>document.getElementById('mb_email')?.focus(),50);
}
function addMember(){
  const email=(document.getElementById('mb_email').value||'').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('請輸入正確的 Email'); return; }
  const t=state.trips.find(x=>x.id===cur.tripId); if(!t) return;
  t.members=t.members||[]; if(!t.members.includes(email)) t.members.push(email);
  persistTrip(cur.tripId); openShare(); toast('已分享給 '+email);
}
function removeMember(email){
  const t=state.trips.find(x=>x.id===cur.tripId); if(!t) return;
  t.members=(t.members||[]).filter(x=>x!==email);
  persistTrip(cur.tripId); openShare(); toast('已移除 '+email);
}

/* ================= 啟動 ================= */
function initApp(){
  if(window.firebase&&FB_CONFIG.apiKey){
    try{
      firebase.initializeApp(FB_CONFIG);
      auth=firebase.auth(); db=firebase.firestore(); cloud=true;
      try{ db.settings({experimentalAutoDetectLongPolling:true}); }catch(e){}   // 解某些 iOS/網路下 Firestore 串流卡住
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
      showGate('loading');
      auth.onAuthStateChanged(onAuth); return;
    }catch(e){ console.warn('Firebase init 失敗，改用本機模式',e); }
  }
  cloud=false; state=loadLocal(); normalizeState(); applyTheme(state.theme||'forest', false); renderHome();
}
initApp();

/* ================= PWA Service Worker 註冊 ================= */
if('serviceWorker' in navigator){
  let swRefreshing=false;
  // 新版 Service Worker 接管後自動重載，讓手機/PWA 不必手動清快取就能吃到最新版
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(swRefreshing) return; swRefreshing=true; location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{ try{reg.update();}catch(e){} }).catch(e=>console.warn('SW 註冊失敗',e));
  });
}
</script>
</body>
